# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    # dcre_pay, NOT dcre_col: the payments split gives this family its own
    # database, and that database is now the family discriminator.
    # DCRE_DB_URL is the WIRE CONTRACT with AGT: AGT injects exactly this name into
    # every stage Job it launches and resolves the VALUE per family
    # (StageDatabases.urlFor -> Flow.PAY -> payServiceDbUrl). One variable routed per
    # family, never one variable name per family. This read said DCRE_PAY_DB_URL until
    # SCRUM-107 and nothing anywhere set that name, so in a pod the service fell back to
    # the committed localhost default below, which in a pod is the pod itself.
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_pay?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Per-service migration history (same isolation idea as PTV_BATCH_)
    database-change-log-table: ptv_databasechangelog
    database-change-log-lock-table: ptv_databasechangeloglock

dcre:
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../../infra/dcre-infra/exchange}
  amount-scale: ${DCRE_AMOUNT_SCALE:2}
  v1-enabled: ${DCRE_V1_ENABLED:false}
  batch:
    table-prefix: PTV_BATCH_
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}
  # No flow discriminator key, and no second datasource for the mandates store.
  # CTV needs both because one service served two families out of one database and
  # its DC gate reads the mandates projection; PTV serves payments only, out of
  # dcre_pay, and payments carry no bank-registered mandates
  # (SPEC-ENDO-COLLECTIONS-FLOW.md: "No mandates, no mandate gate").
  ptv:
    max-partitions: ${DCRE_PTV_MAX_PARTITIONS:5}
    acceptance-mode:
      default: ${DCRE_PTV_ACCEPTANCE_MODE_DEFAULT:ALL_OR_NOTHING}
      # Per-client override map. No DCRE_* env var is wired for the map: set
      # per-client mode via a yaml override. Client tokens are UPPERCASE, so the
      # key MUST be bracketed to survive relaxed binding, e.g. as yaml
      #   clients:
      #     "[FNBRF01]": PARTIAL
      # or as a property  dcre.ptv.acceptance-mode.clients.[FNBRF01]=PARTIAL
      #
      # This key sits under dcre.ptv BECAUSE AcceptanceModeProperties declares
      # prefix "dcre.ptv.acceptance-mode". Moving the Java prefix and leaving the
      # yml key behind binds an EMPTY map and every client silently falls to the
      # default, with the build still green. AcceptanceModePropertiesTest asserts
      # this map is POPULATED, not merely that a lookup returns something.
      clients:
        "[FNBCC02]": PARTIAL
