plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'za.co.fnb.dcre'
version = '2.0'
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
repositories { mavenCentral(); mavenLocal() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    // NO platform-copybook: PTV never reads a file. CTV carries it only for the DC
    // manifest-parity suite, which cuts a spine straight from the copybook sample;
    // PTV reads the spine PRR already wrote, so the layout tables are dead weight.
    implementation 'za.co.fnb.dcre:platform-persistence:0.1.0'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.boot:spring-boot-liquibase'
    implementation 'za.co.fnb.dcre:platform-batch:0.1.0'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.testcontainers:cockroachdb:1.21.4'
    testImplementation platform('io.cucumber:cucumber-bom:7.22.1')
    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-spring'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
    testImplementation 'org.junit.platform:junit-platform-suite'
}
/*
 * CTV's test block pins a CLOSED-PORT default for dcre.ctv.mandates-db-url, so a
 * suite that forgets to declare the mandates container cannot silently borrow
 * whatever is listening on localhost:26257. PTV needs no such guard and must not
 * carry one: there is no mandates datasource in this application context at all
 * (PtvApplication imports three configs, not four), so there is no default URL to
 * fail closed on. PayFlowOnlyTest asserts that absence structurally.
 */
test { useJUnitPlatform() }

/*
 * Paketo buildpacks, NOT a hand-rolled prod JVM Dockerfile (estate mandate:
 * "ALL backend images via Paketo, never a prod JVM Dockerfile; BP_JVM_VERSION=25
 * mandatory"). CTV's Dockerfile is deliberately NOT carried across: a brand-new
 * repo with zero tags and no published image is the cheapest adoption point,
 * exactly as it was for PRR, since there is no running image to keep
 * byte-compatible and no rollback to preserve.
 *
 * imageName has no registry prefix on purpose: dcre images are loaded straight
 * into the kind node with `kind load docker-image`, matching dcre-<svc>:<tag>.
 */
tasks.named('bootBuildImage') {
    imageName = "dcre-ptv:${project.version}"
    // BOTH keys are pinned on purpose (rules/be/java/build.md). Leaving the
    // builder unset resolves correctly today, but only via the Boot plugin's
    // FLOATING default, so a plugin bump would silently change the base image.
    builder = 'paketobuildpacks/builder-noble-java-tiny'
    environment = ['BP_JVM_VERSION': '25']
}
